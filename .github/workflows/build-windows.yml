name: Build (Windows)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: msvc-${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # No libpng on the runner, so libpng and zlib are built from external/libpng and external/zlib.
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: HexStartup-windows-${{ matrix.arch }}
          path: build/Release/HexStartup.exe
